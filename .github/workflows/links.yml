name: links

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  link_checker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build site
      run: npm run build

    - name: Serve built site
      run: npx vitepress preview --port 4173 &

    - name: Wait for server
      run: npx wait-on http://localhost:4173 --timeout 15000

    - name: Link Checker
      uses: lycheeverse/lychee-action@v2
      with:
        args: --verbose --no-progress --base-url http://localhost:4173 --exclude-file .lycheeignore -- .vitepress/dist/**/*.html
        fail: true
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
